name: Fork Build (unsigned installers)

# Fork-friendly build & release: produces unsigned installers and uploads them
# as Actions artifacts. Pushing a fork-v* tag additionally publishes a GitHub
# Release with the installers. The official release.yml requires
# TAURI_SIGNING_PRIVATE_KEY and Apple signing secrets, which are not available
# on forks, so this workflow is the self-hosted path.

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/**"
    tags:
      - "fork-v*"

permissions:
  contents: write

concurrency:
  group: fork-build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-22.04
          - os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file patchelf libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          node --version
          pnpm --version

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Add macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build Tauri app (unsigned)
        # Fork builds are unsigned: disable updater artifacts so no
        # TAURI_SIGNING_PRIVATE_KEY is required (see tauri.fork.conf.json).
        # macOS builds a universal binary (Apple Silicon + Intel).
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            pnpm tauri build --config src-tauri/tauri.fork.conf.json --target universal-apple-darwin
          else
            pnpm tauri build --config src-tauri/tauri.fork.conf.json
          fi

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v5
        with:
          name: cc-switch-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.tar.gz

      - name: Publish GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/fork-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.tar.gz
          generate_release_notes: true